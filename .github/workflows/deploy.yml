name: Trigger Vercel Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
