name: Daily Vercel Deploy

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
